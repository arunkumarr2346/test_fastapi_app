<ul>
    {% for user in users %}
    <li>
        {{ user.name }}
        <button hx-get="/users/edit/{{ user.id }}" hx-target="#user-form">Edit</button>
        <button hx-delete="/users/delete/{{ user.id }}" hx-target="#user-list">Delete</button>
    </li>
    {% endfor %}
</ul>
<div id="user-form"></div>
